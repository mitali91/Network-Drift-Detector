<config>
  <devices>
    <entry name="localhost.localdomain">
      <deviceconfig>
        <system>
          <hostname>pa-fw-01</hostname>
          <dns-setting>
            <servers>
              <primary>10.0.0.53</primary>
              <secondary>10.0.0.54</secondary>
            </servers>
          </dns-setting>
          <ntp-servers>
            <primary-ntp-server>
              <ntp-server-address>10.0.0.1</ntp-server-address>
            </primary-ntp-server>
          </ntp-servers>
        </system>
      </deviceconfig>
      <vsys>
        <entry name="vsys1">
          <zone>
            <entry name="trust"/>
            <entry name="untrust"/>
            <entry name="dmz"/>
          </zone>
        </entry>
      </vsys>
    </entry>
  </devices>
</config>
